name: EditorConfig check

# Enforces the rules in `.editorconfig` (UTF-8, LF line endings,
# 2-space indent, no trailing whitespace except in Markdown). Cheap
# CI gate that catches editor-induced whitespace drift before review.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editorconfig-check:
    name: EditorConfig check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0
        # v4.0.0 (03/09/2026) a supprime l'artefact 'ec-linux-amd64.tar.gz' que
        # cette action cherche ; 'latest' casse donc l'installation.
        # v3.11.3 est la derniere release qui le fournit.
        with:
          version: v3.11.3

      - name: Run editorconfig-checker
        run: editorconfig-checker
