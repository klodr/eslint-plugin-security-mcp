name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: klodr/.github/.github/workflows/reusable-node-ci.yml@9163f7c88cdd419718d2dec1460f04534f8f7586 # main @ 2026-10-19 (Node 24/26 defaults, klodr/.github#55)
    permissions:
      contents: read
      id-token: write
    with:
      enable-build-step: false
      run-format-check: false
      build-test-job-name: "Test"
      enable-codecov-test-analytics: false
      codecov-slug: "klodr/eslint-plugin-security-mcp"
